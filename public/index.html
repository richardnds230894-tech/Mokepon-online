<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>MOKEPON!</title>
        <link rel="stylesheet" href="./styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
        
    </head>
    <body>
        <section id="seleccionar-mascota">
            <h1 class="titulo">MOKEPON</h1>

            <h2 class="subtitulo">Elige Tu mascota</h2>

            <div id="contenedor-de-tarjetas" class="tarjetas">
                
            </div>
            <button class="sci-fi-btn btn-select btn-general" id="boton-seleccionar">Seleccionar</button>
        </section>

        <section id="ver-mapa">
            <h1 id="titulo-mapa" class="titulo">Recorre el Mapa con tu Mokepon</h1>
            <canvas id="mapa"></canvas>

            <section class="caja-botones">
                <button onmouseup="detenerMovimiento()" ontouchend="detenerMovimiento()" onmousedown="moverArriba()" ontouchstart="moverArriba()" class="botones-movimiento">⬆️</button>
            </section>
            <section class="caja-botones">
                <button onmouseup="detenerMovimiento()"  ontouchend="detenerMovimiento()" onmousedown="moverIzquierda()" ontouchstart="moverIzquierda()" class="botones-movimiento">⬅️</button>
                <button onmouseup="detenerMovimiento()"  ontouchend="detenerMovimiento()" onmousedown="moverDerecha()" ontouchstart="moverDerecha()" class="botones-movimiento">➡️</button>
            </section>
            <section class="caja-botones">
                <button onmouseup="detenerMovimiento()"  ontouchend="detenerMovimiento()" onmousedown="moverAbajo()" ontouchstart="moverAbajo()" class="botones-movimiento">⬇️</button>
            </section>
        </section>

        <section id="seleccionar-ataque">
            <h1 class="titulo">MOKEPON</h1>
            
            <h2 class="subtitulo">Elige tu ataque</h2>

            <div id="contenedor-ataques" class="botones-ataque">
                
            </div>
                
            <div id="mensajes">
                    <p id="resultado">Mucha Suerte</p>

                <section id="reiniciar">
                    <button class="sci-fi-btn btn-restart btn-general" id=boton-reiniciar>Reiniciar</button>
                </section>
            </div>

            <div class="carta-ataques">
                <div class="ataques-jugador">
                    <p>JUGADOR-1</p>
                    <p id="vidas-jugador">0</p>
                    <p id="mascota-jugador"></p>
                    <div id="ataque-del-jugador"></div>
                </div>

                <div class="ataques-enemigo">
                    <p>JUGADOR-2</p>
                    <p id="vidas-enemigo">0</p>
                    <p id="mascota-enemigo"></p>
                    <div id="ataque-del-enemigo"></div>
                </div>  
            </div>
        </section>
        <script src="./js/mokepon.js"></script>
    </body>
</html>
